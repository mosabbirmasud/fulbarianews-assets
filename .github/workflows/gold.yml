name: Gold price (BAJUS)

# Protidin kayekbar bajus.org theke sorner dam pore gold.json update kore.
# fulbarianews.com-er "আজকের স্বর্ণের দাম" page ar homepage card ei file theke dam nay.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch BAJUS price
        run: node .github/scripts/gold.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- gold.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "gold-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold.json
          git commit -m "gold.json: BAJUS price update"
          git push
